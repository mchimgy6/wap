<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결 (GYEOL) — MBTI · 정치 성향 가치관 아카이브</title>
    <meta
      name="description"
      content="성격 심리학과 정치학 연구를 바탕으로 MBTI 4가지 인지 지표와 사회적 가치·정치 성향의 상관관계를 살펴보는 16문항 에디토리얼 설문입니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-paper: #f7f4ee;
        --bg-card: #fbf9f5;
        --bg-stone: #ebe6df;
        --ink: #1c1917;
        --ink-sub: #44403c;
        --ink-muted: #78716c;
        --border: #e7e5e4;
        --border-strong: #d6d3d1;
        --accent: #1b4332;
        --accent-hover: #143326;
        --slate: #2b3a55;
        --font-serif: 'Cormorant Garamond', 'Noto Serif KR', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        background-color: var(--bg-paper);
        color: var(--ink);
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-paper);
        color: var(--ink);
        line-height: 1.6;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .font-serif {
        font-family: var(--font-serif);
      }
      .font-mono {
        font-family: var(--font-mono);
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .container {
        width: 100%;
        max-width: 1152px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .container-narrow {
        width: 100%;
        max-width: 768px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .container-result {
        width: 100%;
        max-width: 1024px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Header */
      .site-header {
        width: 100%;
        border-bottom: 1px solid var(--border);
        background-color: rgba(247, 244, 238, 0.95);
        backdrop-filter: blur(4px);
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        max-width: 1152px;
        margin: 0 auto;
      }
      .brand-wordmark {
        font-family: var(--font-serif);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease;
      }
      .brand-wordmark:hover {
        color: var(--accent);
      }
      .header-nav {
        display: none;
        align-items: center;
        gap: 28px;
      }
      .nav-link {
        font-size: 14px;
        font-weight: 500;
        color: #57534e;
        white-space: nowrap;
        flex-shrink: 0;
        padding: 4px 0;
        transition: color 0.15s ease;
      }
      .nav-link:hover,
      .nav-link.active {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .mobile-archive-btn {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-sub);
        padding: 8px 10px;
        white-space: nowrap;
      }

      /* Buttons */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 20px;
        border-radius: 6px;
        background-color: var(--accent);
        color: var(--bg-paper);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }
      .btn-primary-sm {
        min-height: 36px;
        padding: 8px 16px;
        font-size: 13px;
      }
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }
      .btn-outline:hover {
        border-color: #78716c;
        background-color: rgba(235, 230, 223, 0.5);
      }

      main {
        flex: 1;
      }

      /* Sections & Typography */
      .section-divider {
        border-bottom: 1px solid var(--border);
        padding: 48px 0;
      }
      .kicker {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink-muted);
        margin: 0;
      }
      .hero-title {
        font-family: var(--font-serif);
        font-size: clamp(2.1rem, 4vw, 3rem);
        font-weight: 600;
        line-height: 1.22;
        letter-spacing: -0.02em;
        margin: 16px 0 0;
        text-wrap: balance;
      }
      .section-title {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.5vw, 1.875rem);
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.015em;
        margin: 8px 0 0;
        text-wrap: balance;
      }

      /* Grids */
      .hero-grid {
        display: grid;
        gap: 36px;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
        padding: 48px 0;
      }
      .pillars-grid {
        display: grid;
        gap: 36px;
        margin-top: 36px;
      }
      .axes-grid {
        display: grid;
        gap: 24px;
        margin-top: 36px;
      }
      .groups-grid {
        display: grid;
        gap: 24px;
        margin-top: 36px;
      }
      .two-col {
        display: grid;
        gap: 16px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background-color: var(--bg-card);
        padding: 24px;
      }
      .sub-card {
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--bg-paper);
        padding: 14px;
      }

      .artwork-frame {
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid var(--border);
        background-color: var(--bg-stone);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .artwork-frame svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .figure-caption {
        margin: 10px 0 0;
        font-family: var(--font-serif);
        font-size: 12px;
        font-style: italic;
        color: var(--ink-muted);
      }

      /* Quiz */
      .progress-track {
        margin-top: 16px;
        height: 3px;
        width: 100%;
        background-color: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background-color: var(--accent);
        transform-origin: left;
        transition: transform 0.2s ease-out;
      }
      .step-dots {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .step-btn {
        height: 24px;
        width: 28px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .step-btn.current {
        background-color: var(--ink);
        color: var(--bg-paper);
      }
      .step-btn.answered {
        background-color: var(--bg-stone);
        color: var(--ink);
      }
      .step-btn.answered:hover {
        background-color: var(--border-strong);
      }
      .step-btn.disabled {
        background-color: rgba(231, 229, 228, 0.45);
        color: #a8a29e;
        cursor: not-allowed;
      }

      .choices-grid {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .choice-btn {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 68px;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background-color: var(--bg-card);
        text-align: left;
        transition: all 0.15s ease;
      }
      .choice-btn:hover {
        border-color: #78716c;
        background-color: rgba(235, 230, 223, 0.6);
      }
      .choice-btn.selected {
        border-color: var(--accent);
        background-color: var(--accent);
        color: var(--bg-paper);
      }

      /* Result Spectrums */
      .spectrum-bar-bg {
        position: relative;
        height: 10px;
        width: 100%;
        border-radius: 999px;
        background-color: var(--border);
        margin-top: 8px;
      }
      .spectrum-marker {
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background-color: var(--accent);
        border: 2px solid var(--bg-paper);
        transform: translate(-50%, -50%);
      }
      .dual-bar {
        display: flex;
        height: 10px;
        width: 100%;
        border-radius: 999px;
        overflow: hidden;
        background-color: var(--border);
        margin-top: 10px;
      }

      /* Segmented & Filter Tabs */
      .segmented {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background-color: rgba(235, 230, 223, 0.7);
      }
      .seg-btn {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #57534e;
        white-space: nowrap;
      }
      .seg-btn.active {
        background-color: var(--bg-paper);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-btn {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-sub);
        white-space: nowrap;
      }
      .filter-btn.active {
        border-color: var(--accent);
        background-color: var(--accent);
        color: var(--bg-paper);
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background-color: rgba(28, 25, 23, 0.5);
        backdrop-filter: blur(2px);
      }
      .modal-panel {
        position: relative;
        width: 100%;
        max-width: 672px;
        max-height: 88vh;
        overflow-y: auto;
        border-radius: 8px;
        border: 1px solid var(--border);
        background-color: var(--bg-paper);
        padding: 28px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12);
      }
      .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        border: 1px solid var(--border);
        color: #57534e;
      }
      .modal-close:hover {
        background-color: rgba(214, 211, 209, 0.4);
        color: var(--ink);
      }

      /* Footer */
      .site-footer {
        margin-top: 64px;
        border-top: 1px solid var(--border);
        padding: 40px 0;
      }

      /* Responsive Breakpoints */
      @media (min-width: 640px) {
        .container,
        .container-narrow,
        .container-result,
        .header-inner {
          padding-left: 32px;
          padding-right: 32px;
        }
        .two-col {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .pillars-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .choices-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .groups-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 768px) {
        .header-nav {
          display: flex;
        }
        .mobile-archive-btn {
          display: none;
        }
        .axes-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .hero-grid {
          grid-template-columns: 6fr 6fr;
          gap: 48px;
          padding: 64px 0;
        }
        .result-hero-grid {
          grid-template-columns: 7fr 5fr;
          gap: 48px;
        }
        .result-split-12 {
          grid-template-columns: 7fr 5fr;
          gap: 24px;
        }
        .pillars-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .groups-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .choices-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>

          const getAxis = (k) => axes.find((a) => a.axis === k);
          const sn = getAxis('SN');
          const tf = getAxis('TF');
          const jp = getAxis('JP');
          const ei = getAxis('EI');

          const changeOpennessPercent = sn ? sn.rightPercent : 50;
          const empathyWelfarePercent = tf ? tf.rightPercent : 50;
          const autonomyFlexibilityPercent = jp ? jp.rightPercent : 50;
          const activeEngagementPercent = ei ? ei.rightPercent : 50;

          const overallSpectrumScore = Math.round(
            changeOpennessPercent * 0.45 +
              empathyWelfarePercent * 0.3 +
              autonomyFlexibilityPercent * 0.25
          );

          let spectrumLabel = '균형적 중도 스펙트럼';
          let spectrumDescription =
            '안정·원칙 지향 지표(S·T·J)와 변화·공감·자율 지향 지표(N·F·P)가 고르게 공존합니다. 사안에 따라 실용적 안정과 구조적 대안을 유연하게 오가는 경향을 보입니다.';

          if (overallSpectrumScore >= 65) {
            spectrumLabel = '변화·공감·자율 지향 (진보 성향과 닿아 있는 결)';
            spectrumDescription =
              '직관(N)·감정(F)·인식(P) 축의 비중이 높게 나타났습니다. 연구에 따르면 새로운 대안과 체제 개선에 열려 있고(N), 사회적 약자 보호와 복지(F), 개인의 자율성(P)을 중시하는 진보적 가치와 상관관계가 나타나는 편입니다.';
          } else if (overallSpectrumScore >= 54) {
            spectrumLabel = '온건 개혁·균형 지향 (중도 진보 측 스펙트럼)';
            spectrumDescription =
              '변화와 자율, 공감의 가치에 다소 무게를 두면서도 현실적인 기준을 함께 살피는 편입니다. 의제에 따라 진보적 대안과 실용적 균형점을 함께 고민하는 경향이 나타납니다.';
          } else if (overallSpectrumScore <= 35) {
            spectrumLabel = '안정·원칙·질서 지향 (보수 성향과 닿아 있는 결)';
            spectrumDescription =
              '감각(S)·사고(T)·판단(J) 축의 비중이 높게 나타났습니다. 연구에 따르면 검증된 제도와 실용적 안정(S), 효율성과 공정한 규칙(T), 명확한 법치와 사회적 규범(J)을 중시하는 보수적 가치와 상관관계가 나타나는 편입니다.';
          } else if (overallSpectrumScore <= 46) {
            spectrumLabel = '온건 안정·원칙 지향 (중도 보수 측 스펙트럼)';
            spectrumDescription =
              '현실적인 검증과 질서, 효율의 기준에 다소 무게를 두면서도 상황에 따른 유연한 조정을 열어두는 편입니다. 급진적 변화보다 점진적이고 안정적인 보완을 선호하는 경향이 나타납니다.';
          }

          let participationLabel = '균형형 시민 참여 (상황별 전환)';
          let participationDescription =
            '사안의 성격에 따라 혼자 자료를 숙고해 조용히 투표하거나(I), 필요한 자리에서는 직접 대화와 현장에 참여하는(E) 두 방식을 고루 활용합니다.';

          if (activeEngagementPercent >= 58) {
            participationLabel = '적극 행동형 참여 (외향 E 중심)';
            participationDescription =
              '이념적 방향과 별개로, 집회·공개 토론·오프라인 모임처럼 사람들과 직접 부딪히며 목소리를 내는 참여 방식에서 활력을 얻는 경향이 있습니다.';
          } else if (activeEngagementPercent <= 42) {
            participationLabel = '차분한 숙고형 참여 (내향 I 중심)';
            participationDescription =
              '이념적 방향과 별개로, 자료와 공약을 깊이 살핀 뒤 온라인 의견 개진이나 조용한 투표를 통해 자신의 신념을 표현하는 참여 방식을 선호합니다.';
          }

          return {
            changeOpennessPercent,
            empathyWelfarePercent,
            autonomyFlexibilityPercent,
            activeEngagementPercent,
            overallSpectrumScore,
            spectrumLabel,
            spectrumDescription,
            participationLabel,
            participationDescription,
          };
        }

        function calculateMbtiResult(answers) {
          const axesResults = AXES_INFO.map((axisInfo) => {
            const axisQuestions = QUESTIONS.filter((q) => q.axis === axisInfo.key);
            let leftRaw = 0;
            let rightRaw = 0;
            let anchorWinner = axisInfo.leftPole.letter;

            for (const q of axisQuestions) {
              const val = answers[q.id];
              if (!val) continue;
              const absWeight = Math.abs(val);
              const chosenPole = val < 0 ? q.poleA : q.poleB;
              if (chosenPole === axisInfo.leftPole.letter) leftRaw += absWeight;
              else rightRaw += absWeight;
              if (q.isAnchor) anchorWinner = chosenPole;
            }

            const total = leftRaw + rightRaw;
            let leftPercent = 50;
            let rightPercent = 50;
            let winner = anchorWinner;
            let isCloseCall = false;

            if (total > 0) {
              if (leftRaw === rightRaw) {
                winner = anchorWinner;
                isCloseCall = true;
                if (winner === axisInfo.leftPole.letter) {
                  leftPercent = 52;
                  rightPercent = 48;
                } else {
                  leftPercent = 48;
                  rightPercent = 52;
                }
              } else {
                leftPercent = Math.round((leftRaw / total) * 100);
                rightPercent = 100 - leftPercent;
                winner = leftRaw > rightRaw ? axisInfo.leftPole.letter : axisInfo.rightPole.letter;
                isCloseCall = Math.abs(leftPercent - rightPercent) <= 12;
              }
            }

            const winnerPercent = winner === axisInfo.leftPole.letter ? leftPercent : rightPercent;

            return {
              axis: axisInfo.key,
              title: axisInfo.title,
              leftPole: axisInfo.leftPole.letter,
              leftName: axisInfo.leftPole.name,
              leftPercent,
              rightPole: axisInfo.rightPole.letter,
              rightName: axisInfo.rightPole.name,
              rightPercent,
              winner,
              winnerPercent,
              isCloseCall,
            };
          });

          const order = ['EI', 'SN', 'TF', 'JP'];
          const typeCode = order
            .map((key) => (axesResults.find((a) => a.axis === key) || {}).winner || '')
            .join('');

          return {
            typeCode,
            axes: axesResults,
            politicalTendency: calculatePoliticalTendency(axesResults),
          };
        }

                    <h3 style="margin:0;font-size:12px;font-weight:600;color:var(--ink-muted);">드러나는 강점</h3>
                    <ul style="list-style:none;padding:0;margin:12px 0 0;font-size:14px;">
                      ${p.strengths.map((s, i) => `<li style="display:flex;gap:8px;margin-bottom:8px;"><span class="font-mono" style="font-size:12px;color:#a8a29e;">0${i + 1}</span><span>${esc(s)}</span></li>`).join('')}
                    </ul>
                  </div>
                  <div>
                    <h3 style="margin:0;font-size:12px;font-weight:600;color:var(--ink-muted);">돌아볼 지점</h3>
                    <ul style="list-style:none;padding:0;margin:12px 0 0;font-size:14px;">
                      ${p.blindSpots.map((s, i) => `<li style="display:flex;gap:8px;margin-bottom:8px;"><span class="font-mono" style="font-size:12px;color:#a8a29e;">0${i + 1}</span><span>${esc(s)}</span></li>`).join('')}
                    </ul>
                  </div>
                </div>
                <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border);">
                  <h3 style="margin:0;font-size:12px;font-weight:600;color:var(--ink-muted);">결이 이어지는 유형</h3>
                  <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;">
                    ${p.bestMatches
                      .map(
                        (m) => `<button type="button" class="filter-btn" style="background:rgba(235,230,223,0.6);" data-action="modal" data-code="${m}">잘 맞는 결 · <span class="font-mono" style="font-weight:600;">${m}</span> →</button>`
                      )
                      .join('')}
                    <button type="button" class="filter-btn" data-action="modal" data-code="${p.growthMatch}">서로 배우는 결 · <span class="font-mono" style="font-weight:600;">${p.growthMatch}</span> →</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        function render() {
          const root = document.getElementById('app-root');
          const headerCta = document.getElementById('header-cta');
          headerCta.textContent = state.view === 'quiz' ? '처음부터 다시' : '설문 시작';

          if (state.view === 'home') root.innerHTML = renderLanding();
          else if (state.view === 'quiz') root.innerHTML = renderQuiz();
          else if (state.view === 'result') root.innerHTML = renderResult();
          else if (state.view === 'archive') root.innerHTML = renderArchive();

          renderModal();
        }

        function finishQuiz() {
          const computed = calculateMbtiResult(state.answers);
          const record = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            typeCode: computed.typeCode,
            createdAt: new Date().toISOString(),
            axes: computed.axes,
            politicalTendency: computed.politicalTendency,
            answers: { ...state.answers },
          };
          saveHistory(record);
          state.activeRecord = record;
          state.view = 'result';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        }

        function chooseAnswer(val) {
          const q = QUESTIONS[state.currentIndex];
          state.answers[q.id] = val;
          render();
          window.setTimeout(() => {
            if (state.currentIndex < QUESTIONS.length - 1) {
              state.currentIndex += 1;
              render();
            } else {
              finishQuiz();
            }
          }, 160);
        }

        document.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === 'home') {
            state.view = 'home';
            render();
            const sec = btn.dataset.section;
            if (sec) {
              window.setTimeout(() => {
                const el = document.getElementById(sec);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }, 40);
            } else {
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          } else if (action === 'start') {
            state.answers = {};
            state.currentIndex = 0;
            state.copied = false;
            state.view = 'quiz';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          } else if (action === 'archive') {
            state.archiveTab = btn.dataset.tab || 'types';
            state.view = 'archive';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          } else if (action === 'filter') {
            state.archiveFilter = btn.dataset.group || 'ALL';
            render();
          } else if (action === 'modal') {
            state.modalTypeCode = btn.dataset.code || null;
            renderModal();
          } else if (action === 'close-modal') {
            state.modalTypeCode = null;
            renderModal();
          } else if (action === 'choose') {
            chooseAnswer(Number(btn.dataset.val));
          } else if (action === 'jump') {
            state.currentIndex = Number(btn.dataset.idx);
            render();
          } else if (action === 'prev' && state.currentIndex > 0) {
            state.currentIndex -= 1;
            render();
          } else if (action === 'next' && state.currentIndex < QUESTIONS.length - 1) {
            state.currentIndex += 1;
            render();
          } else if (action === 'finish') {
            finishQuiz();
          } else if (action === 'open-record') {
            const rec = state.history[Number(btn.dataset.idx)];
            if (rec) {
              state.activeRecord = rec;
              state.view = 'result';
              window.scrollTo({ top: 0, behavior: 'smooth' });
              render();
            }
          } else if (action === 'clear-history') {
            clearHistory();
            render();
          } else if (action === 'copy' && state.activeRecord) {
            const rec = state.activeRecord;
            const p = MBTI_PROFILES[rec.typeCode];
            const t = rec.politicalTendency || calculatePoliticalTendency(rec.axes);
            const axisText = rec.axes
              .map((a) => `${a.leftPole}/${a.rightPole}: ${a.winner} (${a.winnerPercent}%)`)
              .join(' · ');
            const text = `[결 GYEOL · MBTI × 가치관 성향 설문 결과]\n유형: ${p.code} — ${p.title}\n가치관 스펙트럼: ${t.spectrumLabel}\n참여 스타일: ${t.participationLabel}\n지표 비율: ${axisText}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).catch(() => {});
            }
            state.copied = true;
            render();
            window.setTimeout(() => {
              state.copied = false;
              render();
            }, 2400);
          }
        });

        window.addEventListener('keydown', (e) => {
          if (state.modalTypeCode && e.key === 'Escape') {
            state.modalTypeCode = null;
            renderModal();
            return;
          }
          if (state.view === 'quiz' && !state.modalTypeCode) {
            if (e.key === '1') chooseAnswer(-2);
            else if (e.key === '2') chooseAnswer(-1);
            else if (e.key === '3') chooseAnswer(1);
            else if (e.key === '4') chooseAnswer(2);
            else if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
              state.currentIndex -= 1;
              render();
            }
          }
        });

        render();
      })();
    </script>
  </body>
</html>
